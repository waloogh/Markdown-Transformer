name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 pyinstaller
        run: pip install pyinstaller

      - name: 打包 EXE
        shell: cmd
        run: |
          if exist icon.png (
            pyinstaller --onefile --windowed --icon=icon.png --add-data "md2gongwen.py;." --name "公文格式转换器" md2gongwen_gui.py
          ) else (
            pyinstaller --onefile --windowed --add-data "md2gongwen.py;." --name "公文格式转换器" md2gongwen_gui.py
          )

      - uses: actions/upload-artifact@v4
        with:
          name: 公文格式转换器-Windows
          path: dist/公文格式转换器.exe
